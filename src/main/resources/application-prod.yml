# =============================================================================
# Perfil de PRODUÇÃO (nuvem) — ativado com SPRING_PROFILES_ACTIVE=prod (padrão no Dockerfile).
# Sobrescreve apenas o necessário do application.yml. Nenhum segredo fica no código:
# tudo vem de variáveis de ambiente (RNF-SEC.13). Ver docs/deploy/README.md.
# =============================================================================

server:
  # Plataformas como o Render informam a porta pela variável PORT.
  port: ${PORT:8080}
  # O TLS termina no proxy da plataforma. Respeitar X-Forwarded-* faz o Swagger e demais URLs
  # geradas usarem https:// (sem isso o "Try it out" do Swagger quebra por mixed content).
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  docker:
    compose:
      enabled: false          # em produção não há Docker Compose
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}

# Datasource isolado do Vault (ADR-005). Por padrão usa o mesmo servidor PostgreSQL (isolamento
# lógico pelo schema ng_vault); para isolamento físico, defina VAULT_DB_URL/USERNAME/PASSWORD
# apontando para outra instância, com outras credenciais.
vault:
  datasource:
    url: ${VAULT_DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
    username: ${VAULT_DB_USERNAME:${DB_USERNAME}}
    password: ${VAULT_DB_PASSWORD:${DB_PASSWORD}}
    hikari:
      maximum-pool-size: ${VAULT_DB_POOL_SIZE:3}

neurogen:
  security:
    # Chave AES-256 dos dados sensíveis (Base64 ou hex de 32 bytes). Sem valor padrão de propósito:
    # se a variável faltar, a aplicação não sobe (falha rápida em vez de cifrar com chave fraca).
    sensitive-data-key: ${SENSITIVE_DATA_KEY}

logging:
  level:
    root: INFO
    org.springframework.security: WARN
