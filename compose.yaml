services:
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=neurogen'
      - 'POSTGRES_USER=neurogen'
      - 'POSTGRES_PASSWORD=secret'
    ports:
      # Porta fixada para alinhar com as URLs explícitas de datasource (core + vault).
      - '5432:5432'
    volumes:
      - 'neurogen_pg:/var/lib/postgresql/data'

# NOTA (ADR-005): em produção, o Vault DB é uma instância PostgreSQL SEPARADA, com
# credenciais próprias e sem acesso de rede a partir dos demais serviços. Em dev usamos
# a mesma instância com schema/datasource/credenciais lógicas isoladas (ng_vault).
volumes:
  neurogen_pg:
